name: Build TWRP - Moto E40 (cyprus64)

on:
  workflow_dispatch:

env:
  DEVICE: cyprus64
  VENDOR: motorola
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  BRANCH: twrp-12.1
  LUNCH_PREFIX: twrp        # branch twrp-12.1 exige o prefixo twrp_ (convertido abaixo)
  BUILD_TARGET: bootimage   # A/B + BOARD_USES_RECOVERY_AS_BOOT := true
  DEVICE_REPO: davichingling/twrp_device_motorola_cyprus64
  DEVICE_REPO_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1) Espaço PRIMEIRO: esta action remonta o workspace e apagaria o checkout
      - name: Maximizar espaço de build
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 512
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2) Device tree (seu repositório)
      - name: Checkout do device tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEVICE_REPO }}
          ref: ${{ env.DEVICE_REPO_BRANCH }}
          path: device_tree_src
          fetch-depth: 1

      # 3) Dependências (lista válida para ubuntu-22.04)
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32z1-dev libncurses5 \
            libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip \
            python3 python-is-python3 openjdk-11-jdk-headless cpio libtinfo5 \
            fontconfig xz-utils

      # 4) Git + repo
      - name: Configurar Git e repo
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 5) Verifica se manifesto/branch existem antes de gastar tempo
      - name: Validar manifesto
        run: |
          git ls-remote --exit-code --heads "$MANIFEST" "$BRANCH" \
            || { echo "::error::Branch $BRANCH não existe em $MANIFEST"; exit 1; }

      # 6) Sync com retry
      - name: Inicializar e sincronizar fontes
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 --no-repo-verify -u "$MANIFEST" -b "$BRANCH"
          for i in 1 2 3; do
            repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune && break
            echo "repo sync falhou (tentativa $i), tentando de novo com menos paralelismo..."
            sleep 10
            repo sync -c -j1 --force-sync --no-clone-bundle --no-tags && break
          done
          test -f build/envsetup.sh || { echo "::error::repo sync falhou"; exit 1; }
          df -h "$GITHUB_WORKSPACE"

      # 7) Injetar device tree + correções que evitam erros de build
      - name: Injetar e ajustar device tree
        run: |
          TWRP="$GITHUB_WORKSPACE/twrp"
          DEST="$TWRP/device/$VENDOR/$DEVICE"
          mkdir -p "$DEST"
          rsync -a --exclude='.git' --exclude='.github' \
            "$GITHUB_WORKSPACE/device_tree_src/" "$DEST/"
          cd "$DEST"

          # Arquivos obrigatórios (kernel/dtb prebuilt do firmware stock)
          for f in prebuilt/kernel prebuilt/dtb.img BoardConfig.mk AndroidProducts.mk; do
            [ -s "$f" ] || { echo "::error::Arquivo ausente ou vazio no device tree: $f"; exit 1; }
          done

          # Remove linhas que quebram/atrapalham o build na árvore 12.1
          sed -i '/^PLATFORM_VERSION[[:space:]]*:=/d' BoardConfig.mk
          sed -i '/^TARGET_KERNEL_CONFIG[[:space:]]*:=/d' BoardConfig.mk
          sed -i '/^TARGET_KERNEL_SOURCE[[:space:]]*:=/d' BoardConfig.mk
          sed -i '/^VENDOR_SECURITY_PATCH[[:space:]]*:=[[:space:]]*2021-08-01/d' BoardConfig.mk

          # Usa o recovery.fstab da raiz se o BoardConfig não apontar para um
          if [ -f recovery.fstab ] && ! grep -q '^TARGET_RECOVERY_FSTAB' BoardConfig.mk; then
            echo 'TARGET_RECOVERY_FSTAB := $(DEVICE_PATH)/recovery.fstab' >> BoardConfig.mk
          fi

          # Android 12.1: PRODUCT_STATIC_BOOT_CONTROL_HAL foi removido do build system.
          # Apaga o bloco inteiro (inclusive linhas de continuação com "\").
          if [ -f device.mk ]; then
            awk 'skip { if ($0 !~ /\\[[:space:]]*$/) skip=0; next }
                 /^PRODUCT_STATIC_BOOT_CONTROL_HAL/ { if ($0 ~ /\\[[:space:]]*$/) skip=1; next }
                 { print }' device.mk > device.mk.new && mv device.mk.new device.mk
            # Garante o boot HAL como módulo compartilhado (A/B)
            if ! grep -q 'android.hardware.boot@1' device.mk; then
              printf '\nPRODUCT_PACKAGES += \\\n    android.hardware.boot@1.1-impl \\\n    android.hardware.boot@1.1-impl.recovery\n' >> device.mk
            fi
          fi

          # add_lunch_combo é obsoleto e aponta para produtos omni_ que não existem mais
          rm -f vendorsetup.sh

          # Converte omni_cyprus64 -> twrp_cyprus64 (exigido pelo branch twrp-12.1)
          if [ -f "omni_${DEVICE}.mk" ] && [ ! -f "twrp_${DEVICE}.mk" ]; then
            mv "omni_${DEVICE}.mk" "twrp_${DEVICE}.mk"
          fi
          [ -s "twrp_${DEVICE}.mk" ] || { echo "::error::Makefile do produto não encontrado"; exit 1; }
          MK="twrp_${DEVICE}.mk"
          sed -i "s/omni_${DEVICE}/twrp_${DEVICE}/g" AndroidProducts.mk "$MK"
          sed -i 's#vendor/omni/config/common.mk#vendor/twrp/config/common.mk#g' "$MK"
          sed -i "s/^PRODUCT_NAME[[:space:]]*:=.*/PRODUCT_NAME := twrp_${DEVICE}/" "$MK"
          grep -q 'vendor/twrp/config/common.mk' "$MK" \
            || echo "::warning::$MK não herda vendor/twrp/config/common.mk"
          [ -f "$TWRP/vendor/twrp/config/common.mk" ] \
            || echo "::warning::vendor/twrp/config/common.mk não existe na árvore sincronizada"

          echo "=== AndroidProducts.mk ==="; cat AndroidProducts.mk
          echo "=== $MK ===";           cat "$MK"
          echo "=== device.mk ===";        cat device.mk
          echo "=== BoardConfig.mk ==="; cat BoardConfig.mk
          echo "=== recovery.fstab ==="; cat recovery.fstab
          ls -la "$DEST" "$DEST/prebuilt"

      # 8) Build
      - name: Compilar
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          export ALLOW_NINJA_ENV_RETURN_NONZERO=true
          source build/envsetup.sh
          lunch ${LUNCH_PREFIX}_${DEVICE}-eng
          mka $BUILD_TARGET -j"$(nproc)"

      - name: Listar saída
        if: always()
        run: ls -lh "$GITHUB_WORKSPACE/twrp/out/target/product/$DEVICE/" || true

      # 9) Artefato
      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}
          path: |
            twrp/out/target/product/${{ env.DEVICE }}/boot.img
            twrp/out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: error
