name: Build TWRP for cyprus64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Maximize Disk Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 1024
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev cpio p7zip-full python3

    - name: Configure Git
      run: |
        git config --global user.name "Davi"
        git config --global user.email "davi@example.com"
        git config --global http.sslVerify false

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize and Sync TWRP Source
      run: |
        mkdir -p ~/twrp/omni-11.0
        cd ~/twrp/omni-11.0
        repo init -u https://github.com/omnirom/android.git -b android-11 --depth=1 --no-clone-bundle
        repo sync -j4 --force-sync --no-clone-bundle --no-tags --fail-fast

    - name: Insert Device Tree
      run: |
        mkdir -p ~/twrp/omni-11.0/device/motorola/cyprus64
        cp -r * ~/twrp/omni-11.0/device/motorola/cyprus64/

    - name: Start Compilation
      run: |
        cd ~/twrp/omni-11.0
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_cyprus64-eng
        mka bootimage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: twrp-boot-cyprus64
        path: ~/twrp/omni-11.0/out/target/product/cyprus64/boot.img
